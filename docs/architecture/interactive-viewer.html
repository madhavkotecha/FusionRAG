<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRAG System — Architecture Viewer</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --accent: #3b82f6;
    --accent-dim: #1e40af;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
    --purple: #a855f7;
    --cyan: #06b6d4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 100;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 600;
  }

  .header h1 span { color: var(--accent); }

  .view-tabs {
    display: flex;
    gap: 4px;
  }

  .view-tab {
    padding: 6px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }

  .view-tab:hover { border-color: var(--accent); color: var(--text); }
  .view-tab.active { background: var(--accent); color: white; border-color: var(--accent); }

  .main {
    display: flex;
    height: calc(100vh - 49px);
  }

  .sidebar {
    width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
    flex-shrink: 0;
  }

  .sidebar h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 8px;
    margin-top: 16px;
  }

  .sidebar h3:first-child { margin-top: 0; }

  .node-item {
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.1s;
  }

  .node-item:hover { background: rgba(59, 130, 246, 0.1); }
  .node-item.active { background: rgba(59, 130, 246, 0.2); border: 1px solid var(--accent); }

  .node-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .canvas-area {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  svg {
    width: 100%;
    height: 100%;
  }

  .detail-panel {
    width: 320px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
    flex-shrink: 0;
    display: none;
  }

  .detail-panel.open { display: block; }

  .detail-panel h2 {
    font-size: 16px;
    margin-bottom: 4px;
  }

  .detail-panel .subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  .detail-section {
    margin-bottom: 16px;
  }

  .detail-section h4 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 4px 0;
    border-bottom: 1px solid rgba(51, 65, 85, 0.5);
  }

  .detail-row .label { color: var(--text-dim); }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }

  .badge-green { background: rgba(34, 197, 94, 0.2); color: var(--green); }
  .badge-amber { background: rgba(245, 158, 11, 0.2); color: var(--amber); }
  .badge-blue { background: rgba(59, 130, 246, 0.2); color: var(--accent); }
  .badge-purple { background: rgba(168, 85, 247, 0.2); color: var(--purple); }

  .dep-list {
    list-style: none;
    font-size: 13px;
  }

  .dep-list li {
    padding: 3px 0;
    color: var(--text-dim);
  }

  .dep-list li::before {
    content: "→ ";
    color: var(--accent);
  }

  .close-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 18px;
  }

  .legend {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 12px;
    z-index: 10;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .legend-item:last-child { margin-bottom: 0; }

  .zoom-controls {
    position: absolute;
    bottom: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 10;
  }

  .zoom-btn {
    width: 36px;
    height: 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .zoom-btn:hover { border-color: var(--accent); }

  /* Node styles on canvas */
  .node-group { cursor: pointer; }
  .node-group:hover .node-rect { filter: brightness(1.2); }

  .node-rect {
    rx: 10;
    ry: 10;
    stroke-width: 2;
    transition: filter 0.15s;
  }

  .node-rect.selected {
    stroke: var(--accent) !important;
    stroke-width: 3;
    filter: brightness(1.3);
  }

  .edge-line {
    fill: none;
    stroke: var(--border);
    stroke-width: 2;
    marker-end: url(#arrow);
  }

  .edge-line.highlighted {
    stroke: var(--accent);
    stroke-width: 2.5;
  }
</style>
</head>
<body>

<div class="header">
  <h1><span>RRAG</span> Architecture Viewer</h1>
  <div class="view-tabs">
    <button class="view-tab active" data-view="system">System Context</button>
    <button class="view-tab" data-view="container">Containers</button>
    <button class="view-tab" data-view="data">Data Flow</button>
  </div>
</div>

<div class="main">
  <div class="sidebar" id="sidebar"></div>

  <div class="canvas-area">
    <svg id="canvas">
      <defs>
        <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3"
                markerWidth="10" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 3 L 0 6 z" fill="#475569" />
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 6" refX="10" refY="3"
                markerWidth="10" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 3 L 0 6 z" fill="#3b82f6" />
        </marker>
      </defs>
    </svg>

    <div class="legend" id="legend"></div>

    <div class="zoom-controls">
      <button class="zoom-btn" id="zoom-in">+</button>
      <button class="zoom-btn" id="zoom-out">-</button>
      <button class="zoom-btn" id="zoom-fit">&#8982;</button>
    </div>
  </div>

  <div class="detail-panel" id="detail-panel">
    <button class="close-btn" id="close-detail">&times;</button>
    <div id="detail-content"></div>
  </div>
</div>

// ── State ──────────────────────────────────────────────────
let currentView = "system";
let selectedNode = null;
let transform = { x: 0, y: 0, scale: 1 };
let isPanning = false;
let panStart = { x: 0, y: 0 };

// ── Render Functions ──────────────────────────────────────
function renderSidebar(view) {
  const sb = document.getElementById("sidebar");
  const data = VIEWS[view];
  const groups = {};

  data.nodes.forEach(n => {
    const t = n.type || "other";
    if (!groups[t]) groups[t] = [];
    groups[t].push(n);
  });

  let html = "";
  const typeLabels = {
    actor: "Actors", system: "Systems", external: "External", service: "Services",
    gateway: "Gateway", worker: "Workers", idp: "Identity", store: "Data Stores",
    action: "User Actions", process: "Processing", storage: "Storage"
  };

  for (const [type, nodes] of Object.entries(groups)) {
    html += `<h3>${typeLabels[type] || type}</h3>`;
    nodes.forEach(n => {
      html += `<div class="node-item" data-id="${n.id}" onclick="selectNode('${n.id}')">
        <div class="node-dot" style="background:${n.color}"></div>
        ${n.label}
      </div>`;
    });
  }

  sb.innerHTML = html;
}

function renderLegend(view) {
  const legend = document.getElementById("legend");
  const items = VIEWS[view].legend;
  legend.innerHTML = items.map(i =>
    `<div class="legend-item">
      <div class="node-dot" style="background:${i.color}"></div>
      ${i.label}
    </div>`
  ).join("");
}

function renderCanvas(view) {
  const svg = document.getElementById("canvas");
  const data = VIEWS[view];

  // Clear existing content (keep defs)
  const defs = svg.querySelector("defs");
  svg.innerHTML = "";
  svg.appendChild(defs);

  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.id = "canvas-group";
  svg.appendChild(g);

  // Draw edges
  data.edges.forEach(e => {
    const from = data.nodes.find(n => n.id === e.from);
    const to = data.nodes.find(n => n.id === e.to);
    if (!from || !to) return;

    const x1 = from.x + from.w / 2;
    const y1 = from.y + from.h / 2;
    const x2 = to.x + to.w / 2;
    const y2 = to.y + to.h / 2;

    // Calculate edge points at rectangle borders
    const [sx, sy] = clipToRect(x1, y1, x2, y2, from);
    const [ex, ey] = clipToRect(x2, y2, x1, y1, to);

    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", sx);
    line.setAttribute("y1", sy);
    line.setAttribute("x2", ex);
    line.setAttribute("y2", ey);
    line.setAttribute("class", "edge-line");
    line.setAttribute("data-from", e.from);
    line.setAttribute("data-to", e.to);
    line.setAttribute("marker-end", "url(#arrow)");
    g.appendChild(line);

    // Edge label
    if (e.label) {
      const mx = (sx + ex) / 2;
      const my = (sy + ey) / 2;
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", mx);
      text.setAttribute("y", my - 6);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("fill", "#64748b");
      text.setAttribute("font-size", "11");
      text.textContent = e.label;
      g.appendChild(text);
    }
  });

  // Draw nodes
  data.nodes.forEach(n => {
    const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
    group.setAttribute("class", "node-group");
    group.setAttribute("data-id", n.id);
    group.onclick = () => selectNode(n.id);

    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", n.x);
    rect.setAttribute("y", n.y);
    rect.setAttribute("width", n.w);
    rect.setAttribute("height", n.h);
    rect.setAttribute("fill", n.color + "22");
    rect.setAttribute("stroke", n.color);
    rect.setAttribute("class", "node-rect");
    rect.setAttribute("data-id", n.id);
    group.appendChild(rect);

    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", n.x + n.w / 2);
    text.setAttribute("y", n.y + n.h / 2 + 5);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("fill", "#e2e8f0");
    text.setAttribute("font-size", "13");
    text.setAttribute("font-weight", "600");
    text.textContent = n.label;
    group.appendChild(text);

    g.appendChild(group);
  });

  applyTransform();
}

function clipToRect(fromX, fromY, toX, toY, rect) {
  const cx = rect.x + rect.w / 2;
  const cy = rect.y + rect.h / 2;
  const dx = toX - fromX;
  const dy = toY - fromY;

  if (dx === 0 && dy === 0) return [fromX, fromY];

  const scaleX = Math.abs(dx) > 0 ? (rect.w / 2) / Math.abs(dx) : Infinity;
  const scaleY = Math.abs(dy) > 0 ? (rect.h / 2) / Math.abs(dy) : Infinity;
  const scale = Math.min(scaleX, scaleY);

  return [cx + dx * scale, cy + dy * scale];
}

function selectNode(id) {
  selectedNode = id;
  const data = VIEWS[currentView];
  const node = data.nodes.find(n => n.id === id);
  if (!node) return;

  // Highlight sidebar
  document.querySelectorAll(".node-item").forEach(el => {
    el.classList.toggle("active", el.dataset.id === id);
  });

  // Highlight node rect
  document.querySelectorAll(".node-rect").forEach(el => {
    el.classList.toggle("selected", el.dataset.id === id);
  });

  // Highlight edges
  document.querySelectorAll(".edge-line").forEach(el => {
    const isConnected = el.dataset.from === id || el.dataset.to === id;
    el.classList.toggle("highlighted", isConnected);
    el.setAttribute("marker-end", isConnected ? "url(#arrow-blue)" : "url(#arrow)");
  });

  // Show detail panel
  const panel = document.getElementById("detail-panel");
  const content = document.getElementById("detail-content");

  const deps = data.edges.filter(e => e.from === id || e.to === id);
  const inbound = deps.filter(e => e.to === id).map(e => {
    const n = data.nodes.find(n2 => n2.id === e.from);
    return n ? `${n.label} (${e.label || "depends"})` : e.from;
  });
  const outbound = deps.filter(e => e.from === id).map(e => {
    const n = data.nodes.find(n2 => n2.id === e.to);
    return n ? `${n.label} (${e.label || "depends"})` : e.to;
  });

  content.innerHTML = `
    <h2>${node.label}</h2>
    <div class="subtitle">${node.type}</div>

    <div class="detail-section">
      <h4>Description</h4>
      <p style="font-size:13px;color:var(--text-dim);line-height:1.5">${node.detail.description}</p>
    </div>

    <div class="detail-section">
      <h4>Technical Details</h4>
      <div class="detail-row"><span class="label">Technology</span><span>${node.detail.tech}</span></div>
      <div class="detail-row"><span class="label">Port(s)</span><span>${node.detail.port}</span></div>
    </div>

    ${inbound.length ? `<div class="detail-section">
      <h4>Inbound Connections</h4>
      <ul class="dep-list">${inbound.map(d => `<li>${d}</li>`).join("")}</ul>
    </div>` : ""}

    ${outbound.length ? `<div class="detail-section">
      <h4>Outbound Connections</h4>
      <ul class="dep-list">${outbound.map(d => `<li>${d}</li>`).join("")}</ul>
    </div>` : ""}
  `;

  panel.classList.add("open");
}

function closeDetail() {
  document.getElementById("detail-panel").classList.remove("open");
  selectedNode = null;
  document.querySelectorAll(".node-item").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".node-rect").forEach(el => el.classList.remove("selected"));
  document.querySelectorAll(".edge-line").forEach(el => {
    el.classList.remove("highlighted");
    el.setAttribute("marker-end", "url(#arrow)");
  });
}

function switchView(view) {
  currentView = view;
  selectedNode = null;
  closeDetail();

  document.querySelectorAll(".view-tab").forEach(t => {
    t.classList.toggle("active", t.dataset.view === view);
  });

  // Reset transform for each view
  transform = { x: 60, y: 20, scale: 1 };

  renderSidebar(view);
  renderLegend(view);
  renderCanvas(view);
}

// ── Pan & Zoom ──────────────────────────────────────────
function applyTransform() {
  const g = document.getElementById("canvas-group");
  if (g) {
    g.setAttribute("transform", `translate(${transform.x},${transform.y}) scale(${transform.scale})`);
  }
}

document.getElementById("canvas").addEventListener("mousedown", e => {
  if (e.target.closest(".node-group")) return;
  isPanning = true;
  panStart = { x: e.clientX - transform.x, y: e.clientY - transform.y };
});

document.addEventListener("mousemove", e => {
  if (!isPanning) return;
  transform.x = e.clientX - panStart.x;
  transform.y = e.clientY - panStart.y;
  applyTransform();
});

document.addEventListener("mouseup", () => { isPanning = false; });

document.getElementById("canvas").addEventListener("wheel", e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  transform.scale = Math.max(0.3, Math.min(3, transform.scale * delta));
  applyTransform();
});

document.getElementById("zoom-in").onclick = () => {
  transform.scale = Math.min(3, transform.scale * 1.2);
  applyTransform();
};

document.getElementById("zoom-out").onclick = () => {
  transform.scale = Math.max(0.3, transform.scale * 0.8);
  applyTransform();
};

document.getElementById("zoom-fit").onclick = () => {
  transform = { x: 60, y: 20, scale: 1 };
  applyTransform();
};

// ── Event Listeners ──────────────────────────────────────
document.querySelectorAll(".view-tab").forEach(tab => {
  tab.addEventListener("click", () => switchView(tab.dataset.view));
});

document.getElementById("close-detail").addEventListener("click", closeDetail);

// ── Init ──────────────────────────────────────────────────
switchView("system");
</script>
</body>
</html>
