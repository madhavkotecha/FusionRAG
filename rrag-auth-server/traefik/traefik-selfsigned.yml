# Traefik v3 — staging/internal with self-signed certificates
# Use with: mount this file instead of traefik.yml

api:
  dashboard: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls: {}

providers:
  docker:
    endpoint: "tcp://docker-socket-proxy:2375"
    exposedByDefault: false
    network: rrag-net
  file:
    directory: /etc/traefik/dynamic-selfsigned
    watch: true

log:
  level: WARN

accessLog:
  bufferingSize: 100
