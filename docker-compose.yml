services:
  # ── Infrastructure ──────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: rrag-postgres
    user: "70:70"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rrag-net

  redis:
    image: redis:7-alpine
    container_name: rrag-redis
    command: redis-server --appendonly yes --appendfsync everysec --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rrag-net

  neo4j:
    image: neo4j:5-community
    container_name: rrag-neo4j
    user: "7474:7474"
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4jdata:/data
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/neo4j/run
      - /var/lib/neo4j/plugins
      - /logs
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - rrag-net

  minio:
    image: minio/minio:latest
    container_name: rrag-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rrag-net

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: rrag-opensearch
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD}
      bootstrap.memory_lock: "true"
      plugins.security.ssl.http.enabled: "false"
      plugins.security.ssl.transport.enabled: "false"
      plugins.security.allow_default_init_securityindex: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    read_only: true
    tmpfs:
      - /tmp
      - /usr/share/opensearch/logs:uid=1000,gid=1000
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [IPC_LOCK]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:${OPENSEARCH_ADMIN_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - rrag-net

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: rrag-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    read_only: true
    tmpfs:
      - /tmp
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rrag-net

  keycloak-db:
    image: postgres:16-alpine
    container_name: rrag-keycloak-db
    user: "70:70"
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rrag-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: rrag-keycloak
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /kc
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/rrag-realm.json:/opt/keycloak/data/import/rrag-realm.json:ro
      - ./keycloak/themes/rrag:/opt/keycloak/themes/rrag:ro
    # NOTE: read_only is intentionally NOT enabled for Keycloak. The stock
    # quay.io/keycloak/keycloak image runs `start` non-optimized, which
    # re-augments Quarkus (writing to /opt/keycloak/lib/quarkus) because
    # build-time options (KC_DB, KC_HEALTH_ENABLED, KC_HTTP_RELATIVE_PATH)
    # are supplied at runtime. A read-only root filesystem breaks this
    # (keycloak/keycloak#11286). Still hardened via cap_drop + no-new-privileges.
    read_only: false
    tmpfs:
      - /tmp
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=PathPrefix(`/kc`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.routers.keycloak.priority=100"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    networks:
      - rrag-net

  # ── API Gateway ───────────────────────────────────────────

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    container_name: rrag-docker-socket-proxy
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 0
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks:
      - rrag-net

  traefik:
    image: traefik:v3.6.1
    container_name: rrag-traefik
    command:
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - ./rrag-auth-server/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./rrag-auth-server/traefik/dynamic:/etc/traefik/dynamic:ro
      - acme_data:/acme
    read_only: true
    tmpfs:
      - /tmp
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      - docker-socket-proxy
    networks:
      - rrag-net

  # ── Microservices ───────────────────────────────────────────

  auth-server:
    build:
      context: ./rrag-auth-server
      dockerfile: Dockerfile
    container_name: rrag-auth-server
    environment:
      PORT: 3000
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_UNAUTHENTICATED: ${RATE_LIMIT_UNAUTHENTICATED:-}
      RATE_LIMIT_AUTHENTICATED: ${RATE_LIMIT_AUTHENTICATED:-}
      RATE_LIMIT_API_KEY: ${RATE_LIMIT_API_KEY:-}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      INVITATION_EXPIRE_HOURS: ${INVITATION_EXPIRE_HOURS:-72}
      KC_REALM_URL: http://keycloak:8080/kc/realms/rrag
      KC_PUBLIC_REALM_URL: https://${DOMAIN}/kc/realms/rrag
      KC_CLIENT_ID: rrag-backend
      KC_CLIENT_SECRET: ${KC_CLIENT_SECRET}
    read_only: true
    tmpfs:
      - /tmp
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.routers.auth.tls=true"
      - "traefik.http.routers.auth.priority=100"
      - "traefik.http.services.auth.loadbalancer.server.port=3000"
      - "traefik.http.routers.health.rule=Path(`/health`)"
      - "traefik.http.routers.health.entrypoints=websecure"
      - "traefik.http.routers.health.tls=true"
      - "traefik.http.routers.health.service=auth"
      - "traefik.http.routers.users.rule=PathPrefix(`/users`)"
      - "traefik.http.routers.users.entrypoints=websecure"
      - "traefik.http.routers.users.tls=true"
      - "traefik.http.routers.users.priority=100"
      - "traefik.http.routers.users.service=auth"
      - "traefik.http.routers.workspaces.rule=PathPrefix(`/workspaces`)"
      - "traefik.http.routers.workspaces.entrypoints=websecure"
      - "traefik.http.routers.workspaces.tls=true"
      - "traefik.http.routers.workspaces.priority=100"
      - "traefik.http.routers.workspaces.service=auth"
      - "traefik.http.routers.teams.rule=PathPrefix(`/teams`)"
      - "traefik.http.routers.teams.entrypoints=websecure"
      - "traefik.http.routers.teams.tls=true"
      - "traefik.http.routers.teams.priority=100"
      - "traefik.http.routers.teams.service=auth"
      - "traefik.http.routers.audit.rule=PathPrefix(`/audit-logs`)"
      - "traefik.http.routers.audit.entrypoints=websecure"
      - "traefik.http.routers.audit.tls=true"
      - "traefik.http.routers.audit.priority=100"
      - "traefik.http.routers.audit.service=auth"
      - "traefik.http.middlewares.auth-verify.forwardauth.address=http://auth-server:3000/auth/verify"
      - "traefik.http.middlewares.auth-verify.forwardauth.authResponseHeaders=X-Auth-User-Id,X-Auth-Org-Id,X-Auth-Org-Role,X-Auth-Email,X-Auth-Workspace-Roles,X-Auth-Platform-Admin"
    networks:
      - rrag-net

  pipeline-service:
    build:
      context: ./rrag-pipeline-service
      dockerfile: Dockerfile
    container_name: rrag-pipeline-service
    environment:
      DATABASE_URL: ${DATABASE_URL_ASYNCPG}
      REDIS_URL: ${REDIS_URL}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RRAG_MINIO_ENDPOINT: minio:9000
      RRAG_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      RRAG_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RRAG_MINIO_COMPONENTS_BUCKET: components
      RRAG_MINIO_USE_SSL: "false"
      COMPONENT_LOAD_PATH: /data/components
    volumes:
      - component-cache:/data/components
    read_only: true
    tmpfs:
      - /tmp
      - /root/.cache
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pipeline-api.rule=PathPrefix(`/api/v1/pipelines`) || PathPrefix(`/api/v1/runs`) || PathPrefix(`/api/v1/components`) || PathPrefix(`/api/v1/templates`) || PathPrefix(`/api/v1/admin`)"
      - "traefik.http.routers.pipeline-api.entrypoints=websecure"
      - "traefik.http.routers.pipeline-api.tls=true"
      - "traefik.http.routers.pipeline-api.priority=200"
      - "traefik.http.routers.pipeline-api.middlewares=auth-verify"
      - "traefik.http.routers.pipeline-api.service=pipeline-api"
      - "traefik.http.services.pipeline-api.loadbalancer.server.port=8080"
      - "traefik.http.routers.pipeline-health.rule=Path(`/api/health`)"
      - "traefik.http.routers.pipeline-health.entrypoints=websecure"
      - "traefik.http.routers.pipeline-health.tls=true"
      - "traefik.http.routers.pipeline-health.service=pipeline-health"
      - "traefik.http.services.pipeline-health.loadbalancer.server.port=8080"
    networks:
      - rrag-net

  ingestion:
    build:
      context: ./rrag-ingestion
      dockerfile: Dockerfile
    container_name: rrag-ingestion
    environment:
      RRAG_DATABASE_URL: ${DATABASE_URL_ASYNCPG}
      RRAG_REDIS_URL: ${REDIS_URL_INGESTION}
      RRAG_STORAGE_DIR: /data/documents
      RRAG_CONFIGS_DIR: /app/configs
      CORS_ORIGINS: ${CORS_ORIGINS}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      RRAG_MINIO_ENDPOINT: minio:9000
      RRAG_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      RRAG_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RRAG_MINIO_BUCKET: rrag-documents
      RRAG_MINIO_USE_SSL: "false"
      RRAG_OPENSEARCH_HOST: opensearch
      RRAG_OPENSEARCH_PORT: "9200"
      RRAG_OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      RRAG_OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      RRAG_QDRANT_URL: http://qdrant:6333
      RRAG_QDRANT_API_KEY: ${QDRANT_API_KEY}
      RRAG_LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      RRAG_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RRAG_VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000}
      RRAG_VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      RRAG_VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      RRAG_LLM_MODEL_FAST: ${LLM_MODEL_FAST:-gpt-4o-mini}
      RRAG_LLM_MODEL_CAPABLE: ${LLM_MODEL_CAPABLE:-gpt-4o}
      RRAG_LLM_FALLBACK_TO_OPENAI: ${LLM_FALLBACK_TO_OPENAI:-true}
      RRAG_OPENAI_FALLBACK_MODEL: ${OPENAI_FALLBACK_MODEL:-gpt-4o-mini}
    volumes:
      - ingestion_data:/data/documents
      - configs_data:/app/configs
    read_only: true
    tmpfs:
      - /tmp
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ingestion-api.rule=PathPrefix(`/api/v1/ingestion`)"
      - "traefik.http.routers.ingestion-api.entrypoints=websecure"
      - "traefik.http.routers.ingestion-api.tls=true"
      - "traefik.http.routers.ingestion-api.priority=200"
      - "traefik.http.routers.ingestion-api.middlewares=auth-verify"
      - "traefik.http.routers.ingestion-api.service=ingestion-api"
      - "traefik.http.services.ingestion-api.loadbalancer.server.port=8001"
      # Public published query endpoint (API key auth, no JWT)
      - "traefik.http.routers.ingestion-public.rule=PathPrefix(`/api/v1/ingestion/publish/`) && PathRegexp(`/api/v1/ingestion/publish/.+/query`)"
      - "traefik.http.routers.ingestion-public.entrypoints=websecure"
      - "traefik.http.routers.ingestion-public.tls=true"
      - "traefik.http.routers.ingestion-public.priority=210"
      - "traefik.http.routers.ingestion-public.service=ingestion-api"
    networks:
      - rrag-net

  rq-worker:
    build:
      context: ./rrag-ingestion
      dockerfile: Dockerfile
    container_name: rrag-rq-worker
    command: ["rq", "worker", "--with-scheduler", "-u", "${REDIS_URL_INGESTION}", "ingestion"]
    environment:
      RRAG_DATABASE_URL: ${DATABASE_URL_ASYNCPG}
      RRAG_REDIS_URL: ${REDIS_URL_INGESTION}
      RRAG_STORAGE_DIR: /data/documents
      RRAG_CONFIGS_DIR: /app/configs
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      RRAG_MINIO_ENDPOINT: minio:9000
      RRAG_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      RRAG_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RRAG_MINIO_BUCKET: rrag-documents
      RRAG_MINIO_USE_SSL: "false"
      RRAG_OPENSEARCH_HOST: opensearch
      RRAG_OPENSEARCH_PORT: "9200"
      RRAG_OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      RRAG_OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      RRAG_QDRANT_URL: http://qdrant:6333
      RRAG_QDRANT_API_KEY: ${QDRANT_API_KEY}
      RRAG_LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      RRAG_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RRAG_VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000}
      RRAG_VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      RRAG_VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      RRAG_LLM_MODEL_FAST: ${LLM_MODEL_FAST:-gpt-4o-mini}
      RRAG_LLM_MODEL_CAPABLE: ${LLM_MODEL_CAPABLE:-gpt-4o}
      RRAG_LLM_FALLBACK_TO_OPENAI: ${LLM_FALLBACK_TO_OPENAI:-true}
      RRAG_OPENAI_FALLBACK_MODEL: ${OPENAI_FALLBACK_MODEL:-gpt-4o-mini}
    volumes:
      - ingestion_data:/data/documents
      - configs_data:/app/configs
    read_only: true
    tmpfs:
      - /tmp
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from redis import Redis; r = Redis.from_url('${REDIS_URL_INGESTION}'); assert r.ping()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rrag-net

  # ── LLM Inference (vLLM) ─────────────────────────────────────
  # GPU-only, opt-in:  docker compose --profile vllm up
  # Serves an OpenAI-compatible API with continuous batching + prefix caching
  # (ADR-0018). Non-GPU deployments leave this disabled and rely on the
  # OpenAI fallback configured on the ingestion/rq-worker services.
  vllm:
    image: vllm/vllm-openai:latest
    container_name: rrag-vllm
    profiles: ["vllm"]
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}"
      - "--enable-prefix-caching"
      - "--api-key"
      - "${VLLM_API_KEY:-EMPTY}"
      - "--port"
      - "8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - vllm_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - rrag-net

  frontend:
    build:
      context: ./rrag-frontend
      dockerfile: Dockerfile
    container_name: rrag-frontend
    environment:
      DOMAIN: ${DOMAIN}
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
      - /etc/nginx/conf.d
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - rrag-net

volumes:
  pgdata:
  redisdata:
  neo4jdata:
  ingestion_data:
  configs_data:
  keycloak_pgdata:
  minio_data:
  opensearch_data:
  qdrant_data:
  acme_data:
  component-cache:
  vllm_cache:

networks:
  rrag-net:
    name: rrag-net
    driver: bridge
