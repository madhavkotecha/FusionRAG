# KAG Configuration - OpenAI API + Memory-based storage (no Docker/OpenSPG)

llm: &llm
  type: openai
  base_url: https://api.openai.com/v1
  api_key: !ENV LLM_API_KEY
  model: gpt-4o-mini
  stream: false
  temperature: 0.7

ner_llm: &ner_llm
  type: openai
  base_url: https://api.openai.com/v1
  api_key: !ENV LLM_API_KEY
  model: gpt-4o-mini
  stream: false
  temperature: 0.0

vectorize_model: &vectorize_model
  type: openai
  api_key: !ENV VECTORIZE_MODEL_API_KEY
  base_url: https://api.openai.com/v1
  model: text-embedding-3-small
  vector_dimensions: 1536
vectorizer: *vectorize_model

log:
  level: INFO

project:
  biz_scene: default
  language: en
  namespace: QuickStart
  id: '1'
  host_addr: http://127.0.0.1:8887

#------------kag-builder configuration start----------------#
e1: &e1
  type: knowledge_unit_extractor
  llm: *llm
  ner_prompt:
    type: knowledge_unit_ner
  triple_prompt:
    type: knowledge_unit_triple
  kn_prompt:
    type: knowledge_unit

kag_builder_pipeline:
  chain:
    type: unstructured_builder_chain
    extractor:
      type: naive_rag_extractor
    reader:
      type: md_reader
    post_processor:
      type: kag_post_processor
    splitter:
      type: length_splitter
      split_length: 500
      window_length: 100
    vectorizer:
      type: batch_vectorizer
      vectorize_model: *vectorize_model
    writer:
      type: memory_graph_writer
  num_threads_per_chain: 1
  num_chains: 4
  scanner:
    type: file_scanner
#------------kag-builder configuration end----------------#


#------------kag-solver configuration start----------------#
search_api: &search_api
  type: memory_search_api
  graph_path: ./ckpt/MemoryGraphWriter
  vectorize_model: *vectorize_model

graph_api: &graph_api
  type: memory_graph_api
  graph_path: ./ckpt/MemoryGraphWriter
  vectorize_model: *vectorize_model

kg_fr: &kg_fr
  type: kg_fr_knowledge_unit
  top_k: 10
  graph_api: *graph_api
  search_api: *search_api
  vectorize_model: *vectorize_model
  path_select:
    type: fuzzy_one_hop_select
    llm_client: *ner_llm
    graph_api: *graph_api
    search_api: *search_api
  ppr_chunk_retriever_tool:
    type: ppr_chunk_retriever
    llm_client: *llm
    graph_api: *graph_api
    search_api: *search_api
  entity_linking:
    type: entity_linking
    graph_api: *graph_api
    search_api: *search_api
    recognition_threshold: 0.8
    exclude_types:
      - Chunk
      - AtomicQuery
      - KnowledgeUnit
      - Summary
      - Outline
      - Doc

rc: &rc
  type: rc_open_spg
  vector_chunk_retriever:
    type: vector_chunk_retriever
    vectorize_model: *vectorize_model
    score_threshold: 0.5
    search_api: *search_api
  score_threshold: 0.5
  graph_api: *graph_api
  search_api: *search_api
  vectorize_model: *vectorize_model
  top_k: 10

kag_hybrid_executor: &kag_hybrid_executor_conf
  type: kag_hybrid_retrieval_executor
  retrievers:
    - *rc
  merger:
    type: kag_merger
  enable_summary: true

kag_output_executor: &kag_output_executor_conf
  type: kag_output_executor
  llm_module: *llm

kag_deduce_executor: &kag_deduce_executor_conf
  type: kag_deduce_executor
  llm_module: *llm

kag_solver_pipeline:
  type: kag_static_pipeline
  max_iteration: 3
  planner:
    type: lf_kag_static_planner
    llm: *llm
    plan_prompt:
      type: default_lf_static_planning
    rewrite_prompt:
      type: default_rewrite_sub_task_query
  executors:
    - *kag_hybrid_executor_conf
    - *kag_deduce_executor_conf
    - *kag_output_executor_conf
  generator:
    type: llm_index_generator
    llm_client: *llm
    generated_prompt:
      type: default_multi_hop_generator
    chunk_reranker:
      type: rerank_by_vector
#------------kag-solver configuration end----------------#
