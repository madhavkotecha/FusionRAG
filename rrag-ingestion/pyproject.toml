[project]
name = "rrag-ingestion"
version = "0.1.0"
description = "Modular RAG document ingestion microservice"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "rq>=1.16.0",
    "redis>=5.0.1",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.0.0",
    "tiktoken>=0.7.0",
    "openai>=1.50.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "litellm>=1.40.0",
]

[project.optional-dependencies]
faiss = [
    "faiss-cpu>=1.8.0",
]
minio = [
    "minio>=7.2.0",
]
opensearch = [
    "opensearch-py>=2.6.0",
]
qdrant = [
    "qdrant-client>=1.12.0",
]
local-embeddings = [
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
]
graph = [
    "neo4j>=5.0.0",
    "networkx>=3.0",
]
parsing = [
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
]
docker = [
    "rrag-ingestion[faiss,minio,opensearch,qdrant,graph,parsing]",
]
all = [
    "rrag-ingestion[local-embeddings,minio,opensearch,qdrant,graph,parsing]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rrag_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
