name: corag_ingestion
description: "CoRAG-style chain-of-retrieval: parse, chunk, embed, index, then support multi-hop query decomposition"

steps:
  - component: ultrarag.multi_parser
    config:
      formats: [pdf, docx, md, txt]

  - component: lightrag.token_chunker
    config:
      chunk_token_size: 512
      chunk_overlap_token_size: 50

  - component: openai_embedder
    config:
      model: text-embedding-3-small
      batch_size: 100

  - component: qdrant_indexer
    config:
      url: http://qdrant:6333
      dimension: 1536
      distance: cosine

  - component: lightrag.redis_kv
    config:
      key_prefix: "rrag:corag:"
