name: ultrarag_ingestion
description: "UltraRAG-style modular ingestion: parse multi-format, recursive chunk, embed, index with Qdrant"

steps:
  - component: ultrarag.multi_parser
    config:
      formats: [pdf, docx, md, txt, epub]

  - component: ultrarag.recursive_chunker
    config:
      chunk_size: 512
      chunk_overlap: 50

  - component: openai_embedder
    config:
      model: text-embedding-3-small
      batch_size: 100

  - component: qdrant_indexer
    config:
      url: http://qdrant:6333
      dimension: 1536
      distance: cosine

  - component: lightrag.redis_kv
    config:
      key_prefix: "rrag:ultrarag:"
