name: agentic_rag
description: "Full agentic RAG pipeline: route query, retrieve adaptively, extract, generate with reflection"

steps:
  - component: agent.router
    config:
      llm_model: gpt-4o-mini
      strategies:
        naive_vector: "Simple vector similarity search for factual lookups"
        graph_hybrid: "Combined graph + vector for complex multi-entity questions"
        multi_hop: "Iterative multi-hop retrieval for reasoning chains"
        web_search: "Web search for current events or missing knowledge"

  - component: corag.subquery_decomposer
    config:
      llm_model: gpt-4o-mini
      max_hops: 3

  - component: corag.dense_retriever
    config:
      index_path: /data/documents/faiss_index/default
      top_k: 20

  - component: cross_encoder_reranker
    config:
      model_name: BAAI/bge-reranker-v2-m3
      top_k: 10

  - component: llm_generator
    config:
      model: gpt-4o-mini
      temperature: 0.7
      max_tokens: 2048

  - component: agent.reflection
    config:
      llm_model: gpt-4o-mini
      min_score_threshold: 6.0

  - component: agent.memory
    config:
      max_history: 20
